<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Money Memory: app prototype</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}
button,input,select,textarea{font-family:inherit;font-size:14px;color:#111}
.wrap{display:flex;gap:32px;justify-content:center;align-items:flex-start;flex-wrap:wrap;padding:24px}
.phone{width:390px;height:800px;border:3px solid #111;border-radius:30px;display:flex;flex-direction:column;overflow:hidden;position:relative;background:#fff}
.screen{flex:1;overflow-y:auto;padding:0 0 12px}
.hd{padding:16px 16px 8px}
.hd h1{margin:0;font-size:22px}
.hd p{margin:2px 0 0;font-size:12px;color:#555}
.pad{padding:8px 16px;display:flex;flex-direction:column;gap:10px}
.card{border:2px solid #111;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:#fff}
.card.dark{background:#111;color:#fff}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.06em;margin-top:4px}
.mut{font-size:12px;color:#555}
.card.dark .mut{color:#ddd}
.btn{min-height:44px;padding:0 14px;border:2px solid #111;border-radius:10px;background:#fff;font-weight:700;cursor:pointer}
.btn.p{background:#111;color:#fff}
.btn.f{flex:1}
.btn.s{min-height:36px}
.tag{font-size:11px;font-weight:700;border:1.5px solid #111;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tag.k{background:#111;color:#fff}
.seg{display:flex;border:2px solid #111;border-radius:10px;overflow:hidden}
.seg button{flex:1;min-height:38px;border:0;border-left:2px solid #111;background:#fff;font-weight:700;font-size:12px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button.on{background:#111;color:#fff}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:700}
.fld input,.fld select,.fld textarea{min-height:44px;border:2px solid #111;border-radius:10px;padding:0 10px;background:#fff;font-weight:400}
.fld textarea{padding:8px 10px;min-height:70px}
.tabs{display:flex;border-top:3px solid #111}
.tabs button{flex:1;min-height:58px;border:0;border-left:2px solid #111;background:#fff;font-weight:700;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tabs button:first-child{border-left:0}
.tabs button.on{background:#111;color:#fff}
.tabs svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bub{max-width:84%;padding:9px 11px;border:2px solid #111;border-radius:12px;font-size:14px;line-height:1.4}
.bub.u{align-self:flex-end;background:#111;color:#fff}
.bub.a{align-self:flex-start}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1.5px solid #111;border-radius:999px;background:#fff;padding:6px 10px;font-size:12px;cursor:pointer}
.chat-in{display:flex;gap:8px;padding:8px 12px;border-top:2px solid #111}
.chat-in input{flex:1;min-height:44px;border:2px solid #111;border-radius:22px;padding:0 14px}
.toast{position:absolute;left:16px;right:16px;bottom:70px;background:#111;color:#fff;padding:10px 12px;border-radius:10px;font-size:13px;z-index:5}
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;z-index:9}
.sheet{background:#fff;border-top:3px solid #111;width:100%;padding:16px;display:flex;flex-direction:column;gap:10px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0}
.sheet h2{margin:0;font-size:18px}
pre{margin:0;font-size:11px;background:#eee;border:1.5px solid #111;padding:8px;max-height:200px;overflow:auto;white-space:pre-wrap}
.ph{height:90px;border:2px dashed #111;display:flex;align-items:center;justify-content:center;font-size:12px;background:#eee;border-radius:10px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.chk input{width:22px;height:22px;margin:0;flex:none}
.guide{width:340px;border:2px solid #111;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;position:sticky;top:24px}
.guide h2{margin:0;font-size:16px}
.guide .k{font-size:11px;font-weight:700;letter-spacing:.06em}
.steps{display:flex;flex-direction:column;gap:6px;padding:0;margin:0;list-style:none}
.steps li{display:flex;gap:8px;align-items:center;border:2px solid #111;border-radius:8px;padding:6px 8px;font-size:13px;color:#555;border-style:dashed}
.steps li.done{color:#111;border-style:solid}
.steps li.now{background:#111;color:#fff;border-style:solid}
.steps b{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.strike{text-decoration:line-through;color:#777}
@media (max-width:760px){.phone{width:100%;max-width:390px}.guide{width:100%;max-width:390px;position:static}}
</style>
</head>
<body>
<div class="wrap">
  <div class="phone" id="phone"></div>
  <aside class="guide" id="guide" aria-live="polite"></aside>
</div>
<script>
(function(){
"use strict";
var TODAY=new Date();TODAY.setHours(0,0,0,0);
function addDays(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x}
function addMonths(d,n){var x=new Date(d.getFullYear(),d.getMonth()+n,1);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();x.setDate(Math.min(d.getDate(),last));return x}
function nextDue(d,rep){return rep==="weekly"?addDays(d,7):rep==="monthly"?addMonths(d,1):rep==="yearly"?addMonths(d,12):null}
function fd(d){return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function fdl(d){return d.toLocaleDateString("en-GB",{day:"numeric",month:"long"})}
function iso(d){var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd}
function diff(d){return Math.round((d-TODAY)/86400000)}
function money(n){return "₪"+Number(n).toLocaleString("en-US",{maximumFractionDigits:2})}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var uid=100;function nid(){return ++uid}

var I18N={
 en:{dir:"ltr",tabs:["Home","Plan","Add","Ask AI","Account"],t:["Money Memory","Plan","Add entry","Ask AI","Account and plan"]},
 he:{dir:"rtl",tabs:["בית","תכנון","הוספה","שאל AI","חשבון"],t:["Money Memory","תכנון","הוספת רשומה","שאל AI","חשבון ותוכנית"]},
 ar:{dir:"rtl",tabs:["الرئيسية","الخطة","إضافة","اسأل الذكاء","الحساب"],t:["Money Memory","الخطة","إضافة إدخال","اسأل الذكاء","الحساب والخطة"]}
};
var SCREENS=["home","plan","add","ai","account"];
var GUIDE={
 home:{goal:"I want to see where my money goes and what to do about it today.",why:"Like a car dashboard with a to-do list: the gauges show where you stand, the cards tell you the next move.",steps:["See spent versus budget","Tap an action card (pay, move money, review)","Watch the gauge and the card update"]},
 plan:{goal:"I want to decide how much to spend and how much to save.",why:"Like filling jars: each jar is a limit, and when one is nearly full you slow down.",steps:["Set a limit for each category","Move money toward your savings goal","See progress on Home and in Ask AI"]},
 add:{goal:"I want to record an obligation in a few seconds.",why:"Like dropping a note into a tidy drawer instead of carrying it in your pocket.",steps:["Choose what you are recording","Fill name, amount, date, repeat","Save and see it on Home"]},
 scan:{goal:"I want to avoid typing the details myself.",why:"Like a clerk who reads the receipt for you, and you only sign.",steps:["Pick a receipt or paste an SMS","Check what was read","Confirm and save"]},
 ai:{goal:"I want to understand where my money went.",why:"Like asking a friend who kept your notebook: they answer only from the notebook.",steps:["Ask a question","Read the answer with its period","Need a person? Use Talk to a person"]},
 subs:{goal:"I want to see what quietly drains me every month.",why:"Like dripping taps: each is small, but together they empty the tank.",steps:["See the monthly total","Spot one you do not need","Tap Mark cancelled and watch the total drop"]},
 account:{goal:"I want to stay in control of my plan and my data.",why:"Like the keys to your own house: you decide who comes in and when to lock up.",steps:["Choose language, plan and consents","Confirm any change","Export or delete your data any time"]}
};

var S;
function seed(){
 var d=TODAY;
 var lm=new Date(d.getFullYear(),d.getMonth()-1,1);
 function ex(day,m,a,c,mon){var dd=(mon.getMonth()===d.getMonth()&&mon.getFullYear()===d.getFullYear())?Math.min(day,d.getDate()):day;return {id:nid(),date:new Date(mon.getFullYear(),mon.getMonth(),dd),merchant:m,amount:a,cat:c}}
 var tm=new Date(d.getFullYear(),d.getMonth(),1);
 S={
  screen:"home",step:1,lang:"en",toast:null,modal:null,addType:"bill",form:{},
  scan:{stage:"pick",data:null,error:false,sms:"Card ending 1234 approved ₪87.50 at CAFE NOVA on "+d.getDate()+"/"+(d.getMonth()+1)},
  plan:{tier:"free",cycle:"monthly",endsOn:null,usage:2,limit:20},marketing:false,deleted:false,
  income:12000,
  budgets:{"Groceries":1500,"Transport":500,"Eating out":600,"Health":300,"Fun":300,"Other":400},
  goal:{name:"Emergency fund",target:10000,saved:2400,by:addMonths(TODAY,9),moved:0},
  items:[
   {id:nid(),kind:"bill",name:"Electricity",amount:412,due:addDays(d,-3),repeat:"monthly",paid:false,snooze:null},
   {id:nid(),kind:"bill",name:"Rent",amount:4500,due:addDays(d,2),repeat:"monthly",paid:false,snooze:null},
   {id:nid(),kind:"bill",name:"Internet",amount:99,due:addDays(d,5),repeat:"monthly",paid:false,snooze:null},
   {id:nid(),kind:"owe",name:"Credit card instalment",amount:1200,due:addDays(d,9),repeat:"none",paid:false,snooze:null},
   {id:nid(),kind:"owed",name:"Dan",amount:300,due:addDays(d,-5),repeat:"none",paid:false,snooze:null},
   {id:nid(),kind:"sub",name:"Streaming",amount:45,due:addDays(d,4),repeat:"monthly",cancelled:false},
   {id:nid(),kind:"sub",name:"Music",amount:20,due:addDays(d,11),repeat:"monthly",cancelled:false},
   {id:nid(),kind:"sub",name:"Cloud storage",amount:10,due:addDays(d,19),repeat:"monthly",cancelled:false}
  ],
  expenses:[
   ex(3,"Supermarket",520,"Groceries",lm),ex(10,"Supermarket",430,"Groceries",lm),ex(21,"Supermarket",290,"Groceries",lm),
   ex(5,"Fuel",180,"Transport",lm),ex(18,"Bus card",130,"Transport",lm),
   ex(7,"Restaurant",260,"Eating out",lm),ex(24,"Cafe",220,"Eating out",lm),
   ex(12,"Pharmacy",220,"Health",lm),ex(26,"Cinema",150,"Fun",lm),
   ex(1,"Supermarket",520,"Groceries",tm),ex(5,"Supermarket",430,"Groceries",tm),ex(9,"Supermarket",325,"Groceries",tm),ex(3,"Fuel",180,"Transport",tm),ex(4,"Restaurant",260,"Eating out",tm),ex(8,"Cafe",120,"Eating out",tm),ex(6,"Pharmacy",90,"Health",tm)
  ],
  chat:[{r:"a",t:"Hi! I answer only from your recorded data, and I cannot change anything. Try a question below."}]
 };
}
seed();

function toast(m){S.toast=m;render();clearTimeout(toast.t);toast.t=setTimeout(function(){S.toast=null;render()},2800)}
function go(sc){S.screen=sc;S.step=1;S.modal=null;render()}
function active(k){return S.items.filter(function(i){return i.kind===k&&!i.paid&&!i.cancelled})}
function curMonth(offset){var m=new Date(TODAY.getFullYear(),TODAY.getMonth()+offset,1);return m}
function inMonth(e,m){return e.date.getFullYear()===m.getFullYear()&&e.date.getMonth()===m.getMonth()}

/* ---------- views ---------- */
function billCard(i){
 var over=diff(i.due)<0;
 var sn=i.snooze&&diff(i.snooze)>0;
 var sub=over?"Was due "+fd(i.due)+" ("+(-diff(i.due))+" days ago)":"Due "+fd(i.due)+(diff(i.due)===0?" (today)":"");
 var rep=i.repeat!=="none"?" · repeats "+i.repeat:"";
 var btns=i.kind==="owed"?'<button class="btn f s" data-a="paid" data-id="'+i.id+'">Mark received</button>'
  :'<button class="btn p f s" data-a="paid" data-id="'+i.id+'">Paid</button>'+(sn?'':'<button class="btn f s" data-a="snoozeOpen" data-id="'+i.id+'">Snooze</button>');
 return '<div class="card"><div class="row"><b>'+(i.kind==="owed"?"Owed to me: ":"")+esc(i.name)+'</b><b>'+money(i.amount)+'</b></div>'+
  '<div class="row"><span class="mut">'+sub+rep+'</span>'+(over?'<span class="tag k">Overdue</span>':'')+'</div>'+
  (sn?'<div class="mut">Reminder snoozed until '+fd(i.snooze)+'</div>':'')+'<div class="row">'+btns+'</div></div>';
}
function bar(p,over){p=Math.max(0,Math.min(100,p));return '<div style="height:12px;border:2px solid #111;border-radius:7px;overflow:hidden;background:#fff"><div style="height:100%;width:'+p+'%;background:'+(over?'repeating-linear-gradient(45deg,#111,#111 4px,#fff 4px,#fff 8px)':'#111')+'"></div></div>'}
function spentBy(m){var by={};S.expenses.forEach(function(e){if(inMonth(e,m))by[e.cat]=(by[e.cat]||0)+e.amount});return by}
function totalBudget(){return Object.keys(S.budgets).reduce(function(a,k){return a+S.budgets[k]},0)}
function goalNeed(){var g=S.goal,months=Math.max(1,Math.round((g.by-TODAY)/2629800000)),rem=Math.max(0,g.target-g.saved);return {months:months,rem:rem,per:Math.ceil(rem/months/50)*50}}
function actions(){
 var out=[],ids=function(i){return 'data-id="'+i.id+'"'};
 var bills=active("bill").concat(active("owe")).filter(function(i){return diff(i.due)<=2}).sort(function(a,b){return a.due-b.due});
 bills.forEach(function(i){var d=diff(i.due),sn=i.snooze&&diff(i.snooze)>0;
  out.push({t:esc(i.name)+" "+money(i.amount),s:d<0?"Overdue by "+(-d)+" days":d===0?"Due today":"Due in "+d+" days",tag:d<0?"Overdue":"Payment",b:'<button class="btn p f s" data-a="paid" '+ids(i)+'>Paid</button>'+(sn?'':'<button class="btn f s" data-a="snoozeOpen" '+ids(i)+'>Snooze</button>')})});
 active("owed").filter(function(i){return diff(i.due)<0}).forEach(function(i){out.push({t:esc(i.name)+" owes you "+money(i.amount),s:(-diff(i.due))+" days late",tag:"Owed to you",b:'<button class="btn p f s" data-a="paid" '+ids(i)+'>Mark received</button>'})});
 var by=spentBy(curMonth(0));
 Object.keys(S.budgets).forEach(function(c){var b=S.budgets[c],sp=by[c]||0;if(b>0&&sp/b>=0.8)out.push({t:c+": "+Math.round(sp/b*100)+"% of budget used",s:money(sp)+" of "+money(b)+(sp>b?" (over budget)":""),tag:sp>b?"Over":"Budget",b:'<button class="btn p f s" data-a="go" data-v="plan">Review budget</button>'})});
 var g=S.goal,n=goalNeed();
 if(n.rem>0&&g.moved<n.per)out.push({t:"Move "+money(n.per)+" to "+esc(g.name),s:"To reach "+money(g.target)+" by "+fdl(g.by)+" you need about "+money(n.per)+" a month.",tag:"Saving",b:'<button class="btn p f s" data-a="goalMove" data-n="'+n.per+'">Move '+money(n.per)+'</button><button class="btn f s" data-a="go" data-v="plan">Edit goal</button>'});
 var subs=S.items.filter(function(i){return i.kind==="sub"&&!i.cancelled}),st=subs.reduce(function(a,i){return a+i.amount},0);
 if(subs.length)out.push({t:"Your subscriptions cost "+money(st)+" a month",s:money(st*12)+" a year. Tip (general information): check which you still use.",tag:"Tip",b:'<button class="btn f s" data-a="go" data-v="subs">Review subscriptions</button>'});
 return out.slice(0,6);
}
function home(){
 var by=spentBy(curMonth(0)),spent=Object.keys(by).reduce(function(a,k){return a+by[k]},0),tb=totalBudget(),left=tb-spent;
 var h='<div class="pad"><div class="card dark"><span class="mut">Spent this month</span><b style="font-size:28px">'+money(spent)+'</b>'+
  '<div style="background:#fff;border-radius:7px">'+bar(tb?spent/tb*100:0,spent>tb)+'</div>'+
  '<span class="mut">'+(left>=0?money(left)+" left of your "+money(tb)+" budget":money(-left)+" over your "+money(tb)+" budget")+' · income '+money(S.income)+'</span></div>';
 var act=actions();
 h+='<div class="lbl">WHAT NEEDS YOU NOW</div>';
 if(!act.length)h+='<div class="card"><b>You are all caught up.</b><span class="mut">Nothing needs action today.</span></div>';
 h+=act.map(function(a){return '<div class="card"><div class="row"><b>'+a.t+'</b><span class="tag">'+a.tag+'</span></div><span class="mut">'+a.s+'</span><div class="row">'+a.b+'</div></div>'}).join("");
 h+='<div class="lbl">SPENDING BY CATEGORY</div><div class="card">'+Object.keys(S.budgets).map(function(c){var b=S.budgets[c],sp=by[c]||0;return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><span>'+c+'</span><span class="mut">'+money(sp)+' of '+money(b)+'</span></div>'+bar(b?sp/b*100:0,sp>b)+'</div>'}).join("")+'</div>';
 var items=active("bill").concat(active("owe"),active("owed")).filter(function(i){return diff(i.due)>2||(i.kind==="owed"&&diff(i.due)>=0)}).sort(function(a,b){return a.due-b.due});
 if(items.length)h+='<div class="lbl">UPCOMING PAYMENTS</div>'+items.map(billCard).join("");
 return h+'</div>';
}
function plan(){
 var by=spentBy(curMonth(0)),g=S.goal,n=goalNeed(),tb=totalBudget();
 var subs=S.items.filter(function(i){return i.kind==="sub"&&!i.cancelled}),st=subs.reduce(function(a,i){return a+i.amount},0);
 var h='<div class="pad"><div class="lbl">MONTHLY BUDGET</div><div class="card">'+Object.keys(S.budgets).map(function(c){var b=S.budgets[c],sp=by[c]||0;
  return '<div style="display:flex;flex-direction:column;gap:4px"><div class="row"><b>'+c+'</b><span class="row" style="gap:6px"><button class="btn s" style="min-height:36px;width:36px;padding:0" aria-label="Lower '+c+' budget by 50" data-a="budget" data-cat="'+c+'" data-d="-50">−</button><span style="min-width:62px;text-align:center;font-weight:700">'+money(b)+'</span><button class="btn s" style="min-height:36px;width:36px;padding:0" aria-label="Raise '+c+' budget by 50" data-a="budget" data-cat="'+c+'" data-d="50">+</button></span></div>'+bar(b?sp/b*100:0,sp>b)+'<span class="mut">'+money(sp)+' spent'+(sp>b?" (over budget)":b?" · "+money(b-sp)+" left":"")+'</span></div>'}).join("")+
  '<div class="row" style="border-top:2px solid #111;padding-top:8px"><b>Total budget</b><b>'+money(tb)+'</b></div></div>'+
  '<div class="lbl">SAVINGS GOAL</div><div class="card"><div class="row"><b>'+esc(g.name)+'</b><span class="tag">'+Math.round(g.saved/g.target*100)+'%</span></div>'+bar(g.saved/g.target*100)+
  '<span class="mut">'+money(g.saved)+' of '+money(g.target)+' by '+fdl(g.by)+'</span><span class="mut">'+(n.rem>0?'You need about '+money(n.per)+' a month to get there ('+n.months+' months left).':'Goal reached.')+'</span>'+
  '<div class="row"><button class="btn p f s" data-a="goalMove" data-n="100">Move ₪100</button><button class="btn f s" data-a="goalMove" data-n="500">Move ₪500</button></div></div>'+
  '<div class="lbl">RECURRING</div><div class="card"><div class="row"><b>Subscriptions</b><b>'+money(st)+' / month</b></div><button class="btn s" data-a="go" data-v="subs">Review subscriptions</button></div></div>';
 return h;
}
var TYPES=[["bill","Bill"],["expense","Expense"],["income","Income"],["owe","I owe"],["owed","Owed to me"],["sub","Subscription"]];
function add(){
 var f=S.form,t=S.addType;
 var seg=function(a){return '<div class="seg">'+a.map(function(x){return '<button data-a="type" data-v="'+x[0]+'" class="'+(t===x[0]?"on":"")+'">'+x[1]+'</button>'}).join("")+'</div>'};
 var needsDue=!(t==="expense"||t==="income");
 var cats=Object.keys(S.budgets);
 var h='<div class="pad">'+seg(TYPES.slice(0,3))+seg(TYPES.slice(3))+
 '<div class="row"><button class="btn p f" data-a="scanOpen">Scan receipt</button><button class="btn f" data-a="scanOpen" data-v="sms">Paste bank SMS</button></div>'+
 '<div class="mut" style="text-align:center">or enter by hand</div>'+
 '<label class="fld">Name<input data-f="name" value="'+esc(f.name||"")+'" placeholder="e.g. Water bill"></label>'+
 '<label class="fld">Amount (₪)<input data-f="amount" inputmode="decimal" value="'+esc(f.amount||"")+'" placeholder="0.00"></label>'+
 '<label class="fld">'+(needsDue?"Due date":"Date")+'<input type="date" data-f="date" value="'+esc(f.date||iso(addDays(TODAY,3)))+'"></label>';
 if(t==="expense")h+='<label class="fld">Category<select data-f="cat">'+cats.map(function(c){return '<option'+((f.cat||"Other")===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></label>';
 if(needsDue&&t!=="expense")h+='<label class="fld">Repeat<select data-f="repeat">'+["none","weekly","monthly","yearly"].map(function(r){return '<option value="'+r+'"'+((f.repeat||(t==="sub"?"monthly":"none"))===r?" selected":"")+'>'+r+'</option>'}).join("")+'</select></label>'+
 '<label class="fld">Remind me<select data-f="remind"><option>2 days before, 09:00</option><option>1 day before, 09:00</option><option>On the day, 09:00</option></select></label>';
 h+='<button class="btn p" data-a="save">Save</button></div>';
 return h;
}
function scan(){
 var sc=S.scan,h='<div class="pad">';
 if(sc.stage==="pick"){

/* ---------- AI ---------- */
function answer(q){
 var l=q.toLowerCase();
 var months=["january","february","march","april","may","june","july","august","september","october","november","december"];
 var lm=curMonth(-1),tm=curMonth(0);
 var yr=l.match(/\b(19|20)\d\d\b/);
 var named=months.filter(function(m){return l.indexOf(m)>-1})[0];
 var okNamed=named&&(months.indexOf(named)===lm.getMonth()||months.indexOf(named)===tm.getMonth());
 if((yr&&+yr[0]!==TODAY.getFullYear())||(named&&!okNamed)||/last year/.test(l)){
  return "I have no recorded data for that period, so I cannot answer. I only have "+months[lm.getMonth()]+" and "+months[tm.getMonth()]+".";
 }
 if(/add|delete|remove|create|change|edit/.test(l))return "I can only read your data. To add or change something, use the Add tab.";
 if(/budget/.test(l)){var by=spentBy(tm),parts=Object.keys(S.budgets).map(function(c){var sp=by[c]||0,b=S.budgets[c];return c+": "+Math.round(sp/b*100)+"% ("+money(sp)+" of "+money(b)+")"});return "<b>This month so far</b><br>"+parts.join("<br>")}
 if(/goal|on track|sav(e|ing)/.test(l)){var g=S.goal,n=goalNeed();return esc(g.name)+": "+money(g.saved)+" of "+money(g.target)+" ("+Math.round(g.saved/g.target*100)+"%). To reach it by "+fdl(g.by)+" you need about "+money(n.per)+" a month. This is general information based on your own numbers."}
 if(/owe|owed/.test(l)){var o=active("owed");return o.length?"People who owe you: "+o.map(function(i){return esc(i.name)+" "+money(i.amount)+" (due "+fd(i.due)+")"}).join(", ")+".":"Nobody owes you money right now."}
 if(/subscri/.test(l)){var s=S.items.filter(function(i){return i.kind==="sub"&&!i.cancelled});return "You pay "+money(s.reduce(function(a,i){return a+i.amount},0))+" a month for "+s.length+" subscriptions: "+s.map(function(i){return esc(i.name)}).join(", ")+"."}
 if(/every month|recurring|monthly/.test(l)){var r=S.items.filter(function(i){return !i.paid&&!i.cancelled&&i.repeat==="monthly"});return "Monthly payments: "+r.map(function(i){return esc(i.name)+" "+money(i.amount)}).join(", ")+". Total "+money(r.reduce(function(a,i){return a+i.amount},0))+"."}
 if(/where|spen|went|money go|expens/.test(l)){
  var m=/this month/.test(l)?tm:lm,ex=S.expenses.filter(function(e){return inMonth(e,m)});
  if(!ex.length)return "I have no recorded expenses for that period, so I cannot answer.";
  var by={};ex.forEach(function(e){by[e.cat]=(by[e.cat]||0)+e.amount});
  var arr=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  var last=new Date(m.getFullYear(),m.getMonth()+1,0);
  return "<b>Period: "+fdl(m)+" to "+fdl(last)+"</b><br>"+arr.map(function(k,i){return (i+1)+". "+k+" "+money(by[k])}).join("<br>")+"<br>Total "+money(ex.reduce(function(a,e){return a+e.amount},0))+".";
 }
 return "I can answer about where your money went, what you pay every month, your subscriptions and who owes you. Try one of the suggestions.";
}
function ask(q){
 q=q.trim();if(!q)return;
 S.chat.push({r:"u",t:esc(q)});
 if(S.plan.tier==="free"&&S.plan.usage>=S.plan.limit){S.chat.push({r:"a",t:"You used all "+S.plan.limit+" free AI uses this month. Upgrade to Plus in Account to keep asking."});}
 else{S.plan.usage++;S.chat.push({r:"a",t:answer(q)});}
 S.step=2;render();
}

document.addEventListener("change",function(ev){
 var f=ev.target.dataset&&ev.target.dataset.f;if(!f)return;
 if(f==="lang"){S.lang=ev.target.value;render()}
 else if(f==="marketing"){S.marketing=ev.target.checked;toast(S.marketing?"Offers on.":"Offers off.")}
 else if(f==="agree"){S.form.agree=ev.target.checked}
 else if(f==="s_c"){S.scan.data.cat=ev.target.value}
 else if(f==="repeat"||f==="remind"||f==="date"||f==="cat")S.form[f]=ev.target.value;
});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.id==="q"){ev.preventDefault();A.send()}});
render();
})();
</script>
</body>
</html>
