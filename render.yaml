# Render Blueprint: Money Memory api + PostgreSQL (development environment).
# Staging and production are added later as separate services/databases (see docs/render-deploy.md).
databases:
  - name: money-memory-db-dev
    plan: free            # free Postgres expires: move to a paid plan before real users
    region: frankfurt
    databaseName: money_memory
    user: money_memory

services:
  - type: web
    name: money-memory-api-dev
    runtime: node
    region: frankfurt
    plan: free            # sleeps when idle: use a paid plan for production
    branch: develop
    autoDeploy: true
    buildCommand: corepack enable && pnpm install --no-frozen-lockfile && pnpm --filter api... build
    startCommand: pnpm --filter api migrate:deploy && pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DATABASE_URL
        fromDatabase:
          name: money-memory-db-dev
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER_API_KEY
        sync: false       # set in the Render dashboard
      - key: EMAIL_FROM
        sync: false
      - key: TERMS_VERSION
        value: 2026-11-v1
      - key: PRIVACY_VERSION
        value: 2026-11-v1
